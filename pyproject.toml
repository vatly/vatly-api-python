[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "vatly-api-python"
version = "0.1.0a3"
description = "Python SDK for Vatly, the European Merchant of Record for AI, software and digital products"
keywords = ["vatly", "merchant-of-record", "billing", "payments", "vat", "ai", "sdk"]
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["httpx>=0.27,<1", "pydantic>=2.11,<3", "typing-extensions>=4.12,<5"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/vatly/vatly-api-python"
Documentation = "https://docs.vatly.com"
Issues = "https://github.com/vatly/vatly-api-python/issues"

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=1,<2",
  "ruff>=0.14,<1",
  "mypy>=1.18,<2",
  "build>=1.3,<2",
  "twine>=6,<7",
  "datamodel-code-generator==0.36.0",
  "pyyaml>=6,<7",
  "types-PyYAML>=6,<7",
  "pytest-cov>=7,<8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/vatly"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "scripts", "docs", "openapi.yaml", "README.md", "CHANGELOG.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/vatly"]

[tool.uv]
required-version = ">=0.12.9"

[tool.coverage.run]
branch = true
source = ["vatly"]

[tool.coverage.report]
fail_under = 94
show_missing = true
