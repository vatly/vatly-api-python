name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.9'
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest --cov --cov-report=term-missing --cov-report=xml --cov-report=markdown-append:$GITHUB_STEP_SUMMARY
      - run: uv build && uv run twine check dist/*
      - run: uv run python scripts/check_package.py
  generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.9'
      - run: uv sync --locked
      - run: uv run python scripts/generate.py --check
  published-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.9'
          python-version: '3.12'
      - run: >-
          uv run --isolated --no-project --default-index https://pypi.org/simple
          --with 'vatly-api-python==0.1.0a3' --with 'pytest>=8,<10'
          --with 'pytest-asyncio>=1,<2' --with 'pyyaml>=6,<7'
          python -m pytest -q tests/test_docs.py
